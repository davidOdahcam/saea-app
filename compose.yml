services:
  frontend:
    container_name: saea-app
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - saea-net

  backend:
    container_name: saea-api
    build:
      context: ./backend
      dockerfile: src/SAEA.API/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SAEADb;User Id=sa;Password=Saea@123456;TrustServerCertificate=True;Encrypt=False;
    volumes:
      - ./backend:/src
    networks:
      - saea-net
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saea-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Saea@123456"
    ports:
      - "1433:1433"
    networks:
      - saea-net
    volumes:
      - sqldata:/var/opt/mssql

networks:
  saea-net:
    driver: bridge

volumes:
  sqldata: